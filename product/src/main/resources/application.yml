server:
  port: ${PRODUCT_PORT:8082}
spring:
  application:
    name: product-service
  config:
    import:
      - optional:nacos:product-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:b2c}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:b2c}
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${PRODUCT_DB_URL:jdbc:sqlite:database/mall_product.db}
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
mybatis:
  mapper-locations: classpath:mapper/*.xml
feign:
  client:
    config:
      employee-service:
        connectTimeout: 3000
        readTimeout: 5000

